services:
  postgres:
    image: postgres:17
    container_name: rotina-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rotina}
      POSTGRES_USER: ${POSTGRES_USER:-rotina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotina}
    ports:
      - "5432:5432"
    volumes:
      - rotina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotina} -d ${POSTGRES_DB:-rotina}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rotina-pgdata:
