spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:rotina}
    username: ${POSTGRES_USER:rotina}
    password: ${POSTGRES_PASSWORD:rotina}
  jpa:
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

logging:
  level:
    '[org.hibernate.orm.jdbc.bind]': trace