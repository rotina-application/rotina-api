spring:
  profiles:
    active: dev
  application:
    name: rotina-api
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          '[time_zone]': UTC
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 300000

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: rotina-api
    expiration-minutes: 120
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
